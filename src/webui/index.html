<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mogbus</title>
<style>
:root { color-scheme: light dark; --bg: #fff; --fg: #1b1f24; --line: #d0d7de; --muted: #667085; --acc: #0b5fd6; --bad: #b42318; --ok: #1a7f37; --panel: #f6f8fa; --c0: #0072b2; --c1: #d55e00; --c2: #00875f; --c3: #b5338a; --c4: #a66f00; --c5: #3a9bd9; --c6: #8c564b; --c7: #5f6b7a; }
@media (prefers-color-scheme: dark) { :root { --bg: #14171a; --fg: #e6e8ea; --line: #343a40; --muted: #98a2b3; --acc: #6ea8fe; --bad: #ff8a80; --ok: #56d364; --panel: #1c2128; --c0: #5ab4f0; --c1: #ff9a52; --c2: #3ddc97; --c3: #f08ac8; --c4: #f0c040; --c5: #8fd0ff; --c6: #d2a08f; --c7: #aab4c2; } }
* { box-sizing: border-box; }
body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
main { max-width: 72rem; margin: 0 auto; }
h1 { font-size: 1.3rem; margin: 0 0 8px; }
h2 { font-size: 1.05rem; margin: 20px 0 6px; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 600; }
td.num, td.raw { font-family: ui-monospace, monospace; }
td.raw { color: var(--muted); word-break: break-all; }
button, input, select { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 3px 8px; }
button { cursor: pointer; }
button:hover { border-color: var(--acc); }
button[aria-selected="true"] { border-color: var(--acc); color: var(--acc); font-weight: 600; }
button.link { border: 0; background: none; color: var(--acc); padding: 0; text-decoration: underline; font-family: ui-monospace, monospace; }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 1px; }
label { display: inline-flex; gap: 4px; align-items: center; }
[hidden] { display: none !important; }
input { width: 9rem; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; margin-top: 8px; }
.muted { color: var(--muted); }
.err { color: var(--bad); }
.good { color: var(--ok); }
#message { min-height: 1.5em; }
.scroll { overflow-x: auto; }
#plot svg { width: 100%; height: 300px; display: block; }
#plot .grid { stroke: var(--line); stroke-width: 1; }
#plot .tick { fill: var(--muted); font-size: 11px; }
#plot .line { fill: none; stroke-width: 1.5; stroke-linejoin: round; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 6px; }
.legend span.sw { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 4px; }
.legend .item { display: inline-flex; align-items: center; gap: 4px; }
</style>
</head>
<body>
<main>
<h1>mogbus</h1>
<div class="bar">
<label>Device <select id="device"></select></label>
<span id="tabs" role="tablist" aria-label="Table"></span>
<button id="pause" type="button" aria-pressed="false">Pause</button>
<button id="refresh" type="button">Refresh now</button>
<label>Refresh every <select id="every"></select></label>
<span id="rate" class="muted"></span>
<span id="info" class="muted"></span>
</div>
<div id="message" role="status" aria-live="polite"></div>

<h2>Points</h2>
<div class="bar"><span id="views" role="tablist" aria-label="View"></span></div>
<div id="tableview">
<div class="scroll">
<table>
<thead><tr><th>Plot</th><th>Address</th><th>Type</th><th>Kind</th><th>Access</th><th>Value</th><th>Raw</th></tr></thead>
<tbody id="points"></tbody>
</table>
</div>
<div class="bar" style="margin-top:8px">
<button id="prev" type="button">Previous</button>
<button id="next" type="button">Next</button>
<span id="range" class="muted"></span>
</div>
</div>
<div id="plotview" hidden>
<div class="bar">
<button id="zoomout" type="button" aria-label="Zoom out">&minus;</button>
<button id="zoomin" type="button" aria-label="Zoom in">+</button>
<span id="winlabel" class="muted"></span>
</div>
<div id="plot"></div>
<div id="legend" class="legend"></div>
<div class="bar" style="margin-top:8px">
<label>Add point <select id="padd_space"></select></label>
<input id="padd" list="padd_list" placeholder="address or type" autocomplete="off" aria-label="Point to add">
<datalist id="padd_list"></datalist>
<button id="padd_go" type="button">Add</button>
</div>
</div>

<div class="panel" id="editor">
<div class="bar">
<strong>Write</strong>
<label>Address <input id="addr" inputmode="numeric" size="6"></label>
</div>
<div class="bar">
<label>Decoded value <input id="val"></label>
<button id="setval" type="button">Set value</button>
<span class="muted">sticks until the device restarts; Modbus writes then get exception 02</span>
</div>
<div class="bar">
<label>Raw registers (or bits) <input id="raw" placeholder="1, 2, 3" size="24"></label>
<button id="setraw" type="button">Write raw</button>
<span class="muted">from the address, 0 to 65535 (0 or 1 for bits)</span>
</div>
<div id="werr" class="err" role="alert"></div>
</div>

<h2>Faults</h2>
<div class="scroll">
<table>
<thead><tr><th>Kind</th><th>Percent</th><th>Details</th><th></th></tr></thead>
<tbody id="faults"></tbody>
</table>
</div>
<div class="panel">
<div class="bar">
<label>Kind <select id="fkind"></select></label>
<label>Percent <input id="fpercent" value="100" size="4"></label>
<label id="fdelay_l">delay_ms <input id="fdelay" value="100" size="6"></label>
<label id="fcode_l">exception_code <input id="fcode" value="4" size="4"></label>
<label id="fmode_l">Mode <select id="fmode"><option>pdu</option><option>register</option><option>checksum</option></select></label>
<button id="fset" type="button">Set fault</button>
</div>
<div id="ferr" class="err" role="alert"></div>
</div>
<p class="muted">No authentication: anyone who can reach this port can change device state.</p>

<script>
(function () {
  "use strict";
  var SPACES = ["coil", "discrete", "input", "holding"];
  var KINDS = ["delay", "drop", "exception", "corrupt", "disconnect", "restart", "sensor-disconnect"];
  var PAGE = 50, EVERY_MS = 1000, MAX_SERIES = 8, KEEP = 30000, WINDOW_MS = 300000;
  var st = { unit: null, space: "holding", all: [], page: 0, paused: false, busy: false, gen: 0, view: "table", sel: [] };
  var $ = function (id) { return document.getElementById(id); };

  function api(method, path, body) {
    var o = { method: method, headers: { "Accept": "application/json" } };
    if (method !== "GET") {
      o.headers["Content-Type"] = "application/json";
      if (body !== undefined) { o.body = JSON.stringify(body); }
    }
    return fetch(path, o).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok) { throw new Error(j.error || "HTTP " + r.status); }
        return j;
      });
    });
  }
  function el(tag, text, cls) {
    var e = document.createElement(tag);
    if (text !== undefined) { e.textContent = String(text); }
    if (cls) { e.className = cls; }
    return e;
  }
  function clear(n) { while (n.firstChild) { n.removeChild(n.firstChild); } }
  function say(id, text, bad) {
    var n = $(id);
    n.textContent = text;
    n.className = bad === false ? "good" : "err";
  }
  function base() { return "/api/devices/" + st.unit; }
  function isBit(sp) { return sp === "coil" || sp === "discrete"; }

  /* The registers of one point to text: undo the byte order of each register, then the word order. */
  function decode(pt, regs) {
    var w = regs.slice(), dv;
    if (pt.type === "bit") { return regs[0] ? "1" : "0"; }
    if (pt.byte_order === "little") { w = w.map(function (r) { return ((r & 255) << 8) | (r >> 8); }); }
    if (pt.type === "string") {
      var s = "";
      w.forEach(function (r) { s += String.fromCharCode(r >> 8, r & 255); });
      return s.replace(/[\0 ]+$/, "").replace(/[^\x20-\x7e]/g, "?");
    }
    if (pt.word_order === "low-first") { w.reverse(); }
    dv = new DataView(new ArrayBuffer(8));
    w.forEach(function (r, k) { dv.setUint16(k * 2, r); });
    switch (pt.type) {
      case "u16": return String(dv.getUint16(0));
      case "s16": return String(dv.getInt16(0));
      case "u32": return String(dv.getUint32(0));
      case "s32": return String(dv.getInt32(0));
      case "float32": return String(parseFloat(dv.getFloat32(0).toPrecision(8)));
      case "u64": return dv.getBigUint64(0).toString();
      case "s64": return dv.getBigInt64(0).toString();
      case "float64": return String(dv.getFloat64(0));
    }
    return "?";
  }

  function loadPoints() {
    var gen = ++st.gen, acc = [];
    st.all = [];
    clear($("points"));
    function more(from) {
      return api("GET", base() + "/points?space=" + st.space + "&limit=200&from=" + from).then(function (j) {
        if (gen !== st.gen) { return; }
        acc = acc.concat(j.points);
        if (j.next !== null) { return more(j.next); }
        st.all = acc;
        st.page = Math.min(st.page, Math.max(0, Math.ceil(acc.length / PAGE) - 1));
        render();
      });
    }
    return more(0).catch(function (e) { say("message", "Cannot list points: " + e.message); });
  }

  var cbs = {};    /* address -> plot checkbox of the page on screen */
  var rows = [];   /* {pt, valueCell, rawCell} of the page on screen */
  function render() {
    var body = $("points"), from = st.page * PAGE, part = st.all.slice(from, from + PAGE);
    clear(body);
    cbs = {};
    rows = part.map(function (pt) {
      var tr = el("tr"), pc = el("td"), a = el("td"), b = el("button", pt.address, "link"), v = el("td", "", "num"), r = el("td", "", "raw");
      b.type = "button";
      b.addEventListener("click", function () { $("addr").value = pt.address; $("val").focus(); });
      if (pt.type !== "string") {
        var cb = document.createElement("input");
        cb.type = "checkbox";
        cb.style.width = "auto";
        cb.checked = findSeries(st.space, pt.address) !== null;
        cb.setAttribute("aria-label", "Plot " + st.space + " " + pt.address);
        cb.addEventListener("change", function () { toggleSeries(st.space, pt, cb); });
        pc.appendChild(cb);
        cbs[pt.address] = cb;
      }
      tr.appendChild(pc);
      a.appendChild(b);
      tr.appendChild(a);
      tr.appendChild(el("td", pt.type + (pt.type === "string" ? "[" + pt.registers + "]" : "")));
      tr.appendChild(el("td", pt.kind));
      tr.appendChild(el("td", pt.read_only ? "read-only" : ""));
      tr.appendChild(v);
      tr.appendChild(r);
      body.appendChild(tr);
      return { pt: pt, v: v, r: r };
    });
    $("range").textContent = st.all.length ? "points " + (from + 1) + "-" + (from + part.length) + " of " + st.all.length : "no points in this table";
    $("prev").disabled = st.page === 0;
    $("next").disabled = from + PAGE >= st.all.length;
    refresh();
  }

  function findSeries(space, address) {
    for (var i = 0; i < st.sel.length; i++) {
      if (st.sel[i].space === space && st.sel[i].pt.address === address) { return st.sel[i]; }
    }
    return null;
  }
  function addSeries(space, pt) {
    var i, used = {};
    if (st.sel.length >= MAX_SERIES) {
      say("message", "At most " + MAX_SERIES + " points can be plotted; remove one first");
      return false;
    }
    st.sel.forEach(function (x) { used[x.c] = true; });
    for (i = 0; used[i]; i++) { }
    st.sel.push({ space: space, pt: pt, c: i, buf: [], last: "" });
    say("message", "", false);
    refresh();
    return true;
  }
  function selChanged() { syncChecks(); fillAdd(); requestDraw(); }
  function toggleSeries(space, pt, cb) {
    var ser = findSeries(space, pt.address);
    if (!cb.checked) {
      if (ser) { st.sel.splice(st.sel.indexOf(ser), 1); }
    } else if (!ser) {
      addSeries(space, pt);
    }
    selChanged();
  }
  function syncChecks() {
    rows.forEach(function (row) {
      if (cbs[row.pt.address]) { cbs[row.pt.address].checked = findSeries(st.space, row.pt.address) !== null; }
    });
  }

  /* The points on screen and the plotted series, read together: contiguous points of a table become
     one raw read (<= 125 registers, <= 2000 bits). A point that is both is read once. */
  function refresh() {
    var runs = [], gen = st.gen, items = {}, bySpace = {};
    if (st.busy) { return; }
    rows.forEach(function (row) {
      var k = st.space + ":" + row.pt.address;
      items[k] = { space: st.space, pt: row.pt, row: row, ser: null };
    });
    st.sel.forEach(function (ser) {
      var k = ser.space + ":" + ser.pt.address;
      if (!items[k]) { items[k] = { space: ser.space, pt: ser.pt, row: null, ser: null }; }
      items[k].ser = ser;
    });
    Object.keys(items).forEach(function (k) {
      var it = items[k];
      (bySpace[it.space] = bySpace[it.space] || []).push(it);
    });
    Object.keys(bySpace).forEach(function (space) {
      var limit = isBit(space) ? 2000 : 125, cur = null;
      bySpace[space].sort(function (x, y) { return x.pt.address - y.pt.address; });
      bySpace[space].forEach(function (it) {
        var end = it.pt.address + it.pt.registers;
        if (cur && cur.end === it.pt.address && end - cur.start <= limit) { cur.items.push(it); cur.end = end; }
        else { cur = { space: space, start: it.pt.address, end: end, items: [it] }; runs.push(cur); }
      });
    });
    function sample(ser, t, v, text) {
      ser.buf.push({ t: t, v: v });
      /* Trim in batches: a shift() per sample would be quadratic at 10 ms. */
      if (ser.buf.length > KEEP + 500 || ser.buf[0].t < t - WINDOW_MS - 5000) {
        var cut = Math.max(0, ser.buf.length - KEEP), n = 0;
        while (n < ser.buf.length && ser.buf[n].t < t - WINDOW_MS) { n++; }
        ser.buf.splice(0, Math.max(cut, n));
      }
      ser.last = text;
    }
    st.busy = true;
    Promise.all(runs.map(function (run) {
      return api("GET", base() + "/" + run.space + "/" + run.start + "?count=" + (run.end - run.start)).then(function (j) {
        var t = Date.now();
        if (gen !== st.gen) { return; }
        run.items.forEach(function (it) {
          var regs = j.values.slice(it.pt.address - run.start, it.pt.address - run.start + it.pt.registers);
          var text = decode(it.pt, regs), v = Number(text);
          if (it.row) {
            it.row.v.textContent = text;
            it.row.v.className = "num";
            it.row.r.textContent = regs.join(" ");
          }
          if (it.ser) { sample(it.ser, t, isFinite(v) ? v : null, text); }
        });
      }).catch(function (e) {
        var t = Date.now();
        if (gen !== st.gen) { return; }
        run.items.forEach(function (it) {
          if (it.row) { it.row.v.textContent = e.message; it.row.v.className = "err"; it.row.r.textContent = ""; }
          if (it.ser) { sample(it.ser, t, null, "error"); }
        });
      });
    })).then(function () { st.busy = false; ticked(); requestDraw(); }, function () { st.busy = false; });
    if (Date.now() - faultsAt >= 1000) { loadFaults(); }
  }

  var SVGNS = "http://www.w3.org/2000/svg";
  function svg(tag, attrs, text) {
    var e = document.createElementNS(SVGNS, tag);
    Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, String(attrs[k])); });
    if (text !== undefined) { e.textContent = String(text); }
    return e;
  }
  function fmt(v) { return String(Number(v.toPrecision(6))); }
  /* Round tick step (1, 2 or 5 times a power of ten) giving about n intervals over span. */
  function nice(span, n) {
    var raw = span / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / mag;
    return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * mag;
  }

  /* Rebuilt only when the selection changes, so a click on a remove button is never lost to a redraw. */
  var legendKey = null;
  function buildLegend() {
    var legend = $("legend");
    clear(legend);
    legendKey = st.sel.map(function (x) { return x.space + x.pt.address; }).join();
    st.sel.forEach(function (ser) {
      var item = el("span", "", "item"), sw = el("span", "", "sw"), rm = el("button", "\u00d7");
      sw.style.background = "var(--c" + ser.c + ")";
      item.appendChild(sw);
      item.appendChild(el("span", ser.space + " " + ser.pt.address + " (" + ser.pt.type + ")"));
      ser.valEl = el("span", "-", "num");
      item.appendChild(ser.valEl);
      rm.type = "button";
      rm.setAttribute("aria-label", "Remove " + ser.space + " " + ser.pt.address + " from the plot");
      rm.addEventListener("click", function () {
        st.sel.splice(st.sel.indexOf(ser), 1);
        selChanged();
      });
      item.appendChild(rm);
      legend.appendChild(item);
    });
  }

  /* The plot is a strip chart: "now" is pinned at the right edge and a fixed window slides under it.
     Drawing is decoupled from sampling: samples and zoom only mark the chart dirty, and one animation
     frame draws it; while the plot is on screen and not paused it redraws every frame to keep sliding. */
  /* Add point: the plottable points of one table, fetched once per device and table. */
  var pcache = {};
  function tablePoints(space) {
    var k = st.unit + ":" + space, unit = st.unit, acc = [];
    if (pcache[k]) { return Promise.resolve(pcache[k]); }
    function more(from) {
      return api("GET", "/api/devices/" + unit + "/points?space=" + space + "&limit=200&from=" + from).then(function (j) {
        acc = acc.concat(j.points);
        if (j.next !== null) { return more(j.next); }
        if (unit === st.unit) { pcache[k] = acc; }
        return acc;
      });
    }
    return more(0);
  }
  function pointLabel(space, pt) { return space + " " + pt.address + " \u00b7 " + pt.type + " \u00b7 " + pt.kind; }
  function fillAdd() {
    var space = $("padd_space").value, list = $("padd_list"), unit = st.unit;
    clear(list);
    if (unit === null || !space) { return; }
    tablePoints(space).then(function (pts) {
      if (unit !== st.unit || space !== $("padd_space").value) { return; }
      clear(list);
      pts.forEach(function (pt) {
        var o;
        if (pt.type === "string" || findSeries(space, pt.address) !== null) { return; }
        o = el("option");
        o.value = String(pt.address);
        o.label = pointLabel(space, pt);
        list.appendChild(o);
      });
    }).catch(function (e) { say("message", "Cannot list points: " + e.message); });
  }
  function addFromSearch() {
    var space = $("padd_space").value, text = $("padd").value.trim().toLowerCase();
    if (st.unit === null) { return; }
    tablePoints(space).then(function (pts) {
      var ok = pts.filter(function (pt) { return pt.type !== "string"; }), hit;
      hit = ok.filter(function (pt) { return String(pt.address) === text; });
      if (!hit.length && text !== "") {
        hit = ok.filter(function (pt) { return pointLabel(space, pt).toLowerCase().indexOf(text) >= 0; });
      }
      if (!hit.length) { say("message", "No " + space + " point matches \"" + text + "\"", true); return; }
      if (hit.length > 1) { say("message", hit.length + " " + space + " points match; type more of the address", true); return; }
      if (findSeries(space, hit[0].address) !== null) { say("message", pointLabel(space, hit[0]) + " is already plotted", true); return; }
      if (addSeries(space, hit[0])) { $("padd").value = ""; selChanged(); }
    }).catch(function (e) { say("message", "Cannot list points: " + e.message); });
  }

  var WINDOWS = [1000, 2000, 5000, 10000, 30000, 60000, 120000, 300000], win = 4;
  function fmtSpan(ms) { return ms >= 60000 ? ms / 60000 + " min" : ms / 1000 + " s"; }
  function setWindow(i) {
    win = Math.max(0, Math.min(WINDOWS.length - 1, i));
    try { localStorage.setItem("mogbus.window", String(WINDOWS[win])); } catch (e) { /* storage unavailable */ }
    $("winlabel").textContent = "window " + fmtSpan(WINDOWS[win]);
    $("zoomin").disabled = win === 0;
    $("zoomout").disabled = win === WINDOWS.length - 1;
    requestDraw();
  }
  /* Achieved sampling rate: completed ticks of the last second, shown a few times a second. */
  var ticks = [], rateAt = 0;
  function ticked() {
    var t = Date.now();
    ticks.push(t);
    while (ticks[0] < t - 1000) { ticks.shift(); }
    if (t - rateAt >= 250) { rateAt = t; $("rate").textContent = "\u2248 " + ticks.length + " samples/s"; }
  }

  var raf = null, dirty = false, frozenNow = 0, frames = 0;
  function sliding() { return st.view === "plot" && !st.paused && !document.hidden && st.sel.length > 0; }
  function frame() {
    raf = null;
    if (dirty || sliding()) { dirty = false; frames++; drawPlot(); }
    if (sliding()) { raf = requestAnimationFrame(frame); }
  }
  function requestDraw() {
    dirty = true;
    if (raf === null) { raf = requestAnimationFrame(frame); }
  }
  window.mogbusFrames = function () { return frames; };

  function drawPlot() {
    var host = $("plot"), W = Math.max(320, host.clientWidth || 720), H = 300, L = 56, R = 10, T = 10, B = 24;
    var now = st.paused ? frozenNow : Date.now(), span = WINDOWS[win], t0 = now - span, lo = Infinity, hi = -Infinity, s, i, y, step, plotW = W - L - R;
    var all = [];
    if (st.view !== "plot") { return; }
    clear(host);
    if (legendKey !== st.sel.map(function (x) { return x.space + x.pt.address; }).join()) { buildLegend(); }
    st.sel.forEach(function (ser) { ser.valEl.textContent = ser.last === "" ? "-" : ser.last; });
    if (!st.sel.length) { host.appendChild(el("p", "Tick Plot on points in the table, or add one below, to plot them", "muted")); return; }
    function px(t) { return L + (t - t0) / span * plotW; }
    /* One pass per series: the visible samples, reduced to the minimum and maximum of every pixel column. */
    st.sel.forEach(function (ser) {
      var buf = ser.buf, a = 0, b = buf.length, m, segs = [], cur = null, col = -1, mn = null, mx = null, p, x;
      while (a < b) { m = (a + b) >> 1; if (buf[m].t < t0) { a = m + 1; } else { b = m; } }
      function flush() {
        if (mn === null) { return; }
        if (mn === mx) { cur.push(mn); }
        else if (mn.t < mx.t) { cur.push(mn, mx); }
        else { cur.push(mx, mn); }
        mn = mx = null;
      }
      for (; a < buf.length && buf[a].t <= now; a++) {
        p = buf[a];
        if (p.v === null) { flush(); cur = null; col = -1; continue; }
        if (!cur) { cur = []; segs.push(cur); }
        x = Math.floor(px(p.t));
        if (x !== col) { flush(); col = x; mn = mx = p; }
        else { if (p.v < mn.v) { mn = p; } if (p.v > mx.v) { mx = p; } }
        if (p.v < lo) { lo = p.v; }
        if (p.v > hi) { hi = p.v; }
      }
      flush();
      all.push(segs);
    });
    if (lo > hi) { lo = 0; hi = 1; }
    if (lo === hi) { lo -= 1; hi += 1; }
    step = nice(hi - lo, 4);
    lo = Math.floor(lo / step) * step;
    hi = Math.ceil(hi / step) * step;
    if (lo === hi) { hi = lo + step; }
    function py(v) { return T + (hi - v) / (hi - lo) * (H - T - B); }
    s = svg("svg", { viewBox: "0 0 " + W + " " + H, role: "img", "aria-label": "Plot of the selected points over the last " + fmtSpan(span) });
    for (i = 0; lo + i * step <= hi + step / 2; i++) {
      y = lo + i * step;
      s.appendChild(svg("line", { x1: L, x2: W - R, y1: py(y), y2: py(y), "class": "grid" }));
      s.appendChild(svg("text", { x: L - 4, y: py(y) + 4, "text-anchor": "end", "class": "tick" }, fmt(y)));
    }
    /* Gridlines sit at absolute multiples of the step, so they slide with the data; labels count back from now. */
    step = nice(span, 5);
    for (i = Math.ceil(t0 / step); i * step <= now; i++) {
      var x = px(i * step), r = now - i * step;
      if (x < L) { continue; }
      s.appendChild(svg("line", { x1: x, x2: x, y1: T, y2: H - B, "class": "grid" }));
      if (x < W - R - 34) {
        s.appendChild(svg("text", { x: x, y: H - 8, "text-anchor": "middle", "class": "tick" },
          "-" + (step >= 1000 ? Math.round(r / 1000) + "s" : Math.round(r / 10) * 10 + "ms")));
      }
    }
    s.appendChild(svg("text", { x: W - R, y: H - 8, "text-anchor": "end", "class": "tick" }, "now"));
    st.sel.forEach(function (ser, n) {
      var color = "var(--c" + ser.c + ")", bit = isBit(ser.space);
      all[n].forEach(function (seg) {
        var e, k, d;
        if (seg.length === 1) {
          e = svg("circle", { cx: px(seg[0].t), cy: py(seg[0].v), r: 2 });
          e.style.fill = color;
        } else {
          d = "M" + px(seg[0].t).toFixed(1) + " " + py(seg[0].v).toFixed(1);
          for (k = 1; k < seg.length; k++) {
            if (bit) { d += "H" + px(seg[k].t).toFixed(1) + "V" + py(seg[k].v).toFixed(1); }
            else { d += "L" + px(seg[k].t).toFixed(1) + " " + py(seg[k].v).toFixed(1); }
          }
          e = svg("path", { d: d, "class": "line" });
          e.style.stroke = color;
        }
        s.appendChild(e);
      });
    });
    host.appendChild(s);
  }

  var faultsAt = 0;
  function loadFaults() {
    var gen = st.gen;
    faultsAt = Date.now();
    api("GET", base() + "/faults").then(function (j) {
      var body = $("faults");
      if (gen !== st.gen) { return; }
      clear(body);
      j.faults.forEach(function (f) {
        var tr = el("tr"), d = [], b = el("button", "Clear"), td = el("td");
        if (f.delay_ms !== undefined) { d.push("delay_ms " + f.delay_ms); }
        if (f.exception_code !== undefined) { d.push("exception_code " + f.exception_code); }
        if (f.mode !== undefined) { d.push("mode " + f.mode); }
        if (f.scheduled) { d.push("scheduled"); }
        tr.appendChild(el("td", f.kind));
        tr.appendChild(el("td", f.percent));
        tr.appendChild(el("td", d.join(", ")));
        b.type = "button";
        b.setAttribute("aria-label", "Clear fault " + f.kind);
        b.addEventListener("click", function () {
          api("DELETE", base() + "/faults/" + f.kind).then(function () { say("ferr", "Cleared " + f.kind, false); loadFaults(); })
            .catch(function (e) { say("ferr", e.message); });
        });
        td.appendChild(b);
        tr.appendChild(td);
        body.appendChild(tr);
      });
      if (!j.faults.length) { var e = el("tr"); var c = el("td", "No faults set", "muted"); c.colSpan = 4; e.appendChild(c); body.appendChild(e); }
    }).catch(function (e) { say("ferr", "Cannot list faults: " + e.message); });
  }

  function num(id) { var s = $(id).value.trim(); return /^-?\d+(\.\d+)?([eE][-+]?\d+)?$/.test(s) ? Number(s) : NaN; }
  function addr() {
    var a = num("addr");
    if (!(a >= 0 && a <= 65535 && a === Math.floor(a))) { say("werr", "Address must be a number from 0 to 65535"); return null; }
    return a;
  }
  function write(method, path, body, ok) {
    api(method, path, body).then(function () { say("werr", ok, false); refresh(); })
      .catch(function (e) { say("werr", e.message); });
  }
  $("setval").addEventListener("click", function () {
    var a = addr(), v = num("val");
    if (a === null) { return; }
    if (isNaN(v)) { say("werr", "Value must be a number"); return; }
    write("PUT", base() + "/" + st.space + "/" + a + "/value", { value: v }, "Value set at " + a);
  });
  $("setraw").addEventListener("click", function () {
    var a = addr(), vals;
    if (a === null) { return; }
    vals = $("raw").value.split(/[\s,]+/).filter(Boolean).map(Number);
    if (!vals.length || vals.some(function (n) { return !isFinite(n); })) { say("werr", "Raw values must be a list of numbers"); return; }
    write("PUT", base() + "/" + st.space + "/" + a, { values: vals }, "Wrote " + vals.length + " value" + (vals.length === 1 ? "" : "s") + " at " + a);
  });
  $("fkind").addEventListener("change", fields);
  function fields() {
    var k = $("fkind").value;
    $("fdelay_l").hidden = k !== "delay";
    $("fcode_l").hidden = k !== "exception";
    $("fmode_l").hidden = k !== "corrupt";
  }
  $("fset").addEventListener("click", function () {
    var k = $("fkind").value, b = { percent: num("fpercent") };
    if (k === "delay") { b.delay_ms = num("fdelay"); }
    if (k === "exception") { b.exception_code = num("fcode"); }
    if (k === "corrupt") { b.mode = $("fmode").value; }
    if (Object.keys(b).some(function (n) { return n !== "mode" && isNaN(b[n]); })) { say("ferr", "Fields must be numbers"); return; }
    api("PUT", base() + "/faults/" + k, b).then(function () { say("ferr", "Set " + k, false); loadFaults(); })
      .catch(function (e) { say("ferr", e.message); });
  });

  $("pause").addEventListener("click", function () {
    st.paused = !st.paused;
    this.textContent = st.paused ? "Resume" : "Pause";
    this.setAttribute("aria-pressed", String(st.paused));
    frozenNow = Date.now();
    ticks = [];
    $("rate").textContent = "";
    requestDraw();
  });
  $("refresh").addEventListener("click", refresh);
  $("prev").addEventListener("click", function () { st.page--; render(); });
  $("next").addEventListener("click", function () { st.page++; render(); });
  $("device").addEventListener("change", function () { st.unit = this.value; st.page = 0; st.sel = []; pcache = {}; requestDraw(); loadPoints(); fillAdd(); });

  var EVERY = [10, 20, 50, 100, 250, 500, 1000, 2000, 5000, 10000], every = EVERY_MS, timer = null;
  function schedule() {
    if (timer !== null) { clearInterval(timer); }
    timer = setInterval(function () { if (!st.paused && !document.hidden && st.unit !== null) { refresh(); } }, every);
  }
  function tabs() {
    var sel = $("every"), saved = null;
    try { saved = Number(localStorage.getItem("mogbus.every")); } catch (e) { saved = null; }
    if (EVERY.indexOf(saved) >= 0) { every = saved; }
    EVERY.forEach(function (ms) {
      var o = el("option", ms < 1000 ? ms + " ms" : ms / 1000 + " s");
      o.value = ms;
      o.selected = ms === every;
      sel.appendChild(o);
    });
    sel.addEventListener("change", function () {
      every = Number(sel.value);
      try { localStorage.setItem("mogbus.every", String(every)); } catch (e) { /* storage unavailable */ }
      if (st.unit !== null) { schedule(); }
    });
    var savedWin = null;
    try { savedWin = Number(localStorage.getItem("mogbus.window")); } catch (e) { savedWin = null; }
    if (WINDOWS.indexOf(savedWin) >= 0) { win = WINDOWS.indexOf(savedWin); }
    $("zoomin").addEventListener("click", function () { setWindow(win - 1); });
    $("zoomout").addEventListener("click", function () { setWindow(win + 1); });
    setWindow(win);
    var wheelAt = 0;
    $("plot").addEventListener("wheel", function (ev) {
      var now = Date.now();
      ev.preventDefault();
      if (Math.abs(ev.deltaY) < 4 || now - wheelAt < 120) { return; }
      wheelAt = now;
      setWindow(win + (ev.deltaY < 0 ? -1 : 1));
    }, { passive: false });
    document.addEventListener("visibilitychange", requestDraw);
    SPACES.forEach(function (s) { var o = el("option", s); o.value = s; $("padd_space").appendChild(o); });
    $("padd_space").value = st.space;
    $("padd_space").addEventListener("change", fillAdd);
    $("padd_go").addEventListener("click", addFromSearch);
    $("padd").addEventListener("keydown", function (ev) { if (ev.key === "Enter") { ev.preventDefault(); addFromSearch(); } });
    var t = $("tabs");
    SPACES.forEach(function (s) {
      var b = el("button", s);
      b.type = "button";
      b.setAttribute("role", "tab");
      b.setAttribute("aria-selected", String(s === st.space));
      b.addEventListener("click", function () {
        st.space = s; st.page = 0;
        $("padd_space").value = s;
        fillAdd();
        Array.prototype.forEach.call(t.children, function (c) { c.setAttribute("aria-selected", String(c === b)); });
        loadPoints();
      });
      t.appendChild(b);
    });
    ["Table", "Plot"].forEach(function (name) {
      var b = el("button", name), v = name.toLowerCase();
      b.type = "button";
      b.setAttribute("role", "tab");
      b.setAttribute("aria-selected", String(v === st.view));
      b.addEventListener("click", function () {
        st.view = v;
        Array.prototype.forEach.call($("views").children, function (c) { c.setAttribute("aria-selected", String(c === b)); });
        $("tableview").hidden = v !== "table";
        $("plotview").hidden = v !== "plot";
        requestDraw();
      });
      $("views").appendChild(b);
    });
    KINDS.forEach(function (k) { $("fkind").appendChild(el("option", k)); });
    fields();
  }

  tabs();
  api("GET", "/api/devices").then(function (devices) {
    var sel = $("device");
    devices.forEach(function (d) {
      var o = el("option", "unit " + d.unit + " - " + d.name);
      o.value = d.unit;
      sel.appendChild(o);
    });
    $("info").textContent = devices.length + " device" + (devices.length === 1 ? "" : "s");
    if (!devices.length) { return; }
    st.unit = devices[0].unit;
    loadPoints();
    fillAdd();
    schedule();
  }).catch(function (e) { say("message", "Cannot read /api/devices: " + e.message); });
}());
</script>
</main>
</body>
