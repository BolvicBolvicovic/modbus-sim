name: Release

# Tag vX.Y.Z (must match MOGBUS_VERSION_* in include/mogbus.h) builds, tests and
# publishes versioned tarballs, SPDX SBOMs, checksums and build provenance.
# workflow_dispatch is a dry run: it builds and uploads workflow artifacts only.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install OpenSSL development files and clang
        run: sudo apt-get update && sudo apt-get install -y libssl-dev clang

      - name: Check the tag matches the library version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(awk '/^#define MOGBUS_VERSION_(MAJOR|MINOR|PATCH)/ { v = v (v ? "." : "") $3 } END { print v }' include/mogbus.h)
          echo "include/mogbus.h version: $version"
          if [ "$REF_TYPE" = tag ] && [ "$REF_NAME" != "v$version" ]; then
            echo "tag $REF_NAME does not match include/mogbus.h version v$version" >&2
            exit 1
          fi

      - name: Unit tests
        run: make -j"$(nproc)" tests

      - name: Build the release tarball and SBOM
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          make -j"$(nproc)" dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.runner }}
          path: |
            dist/*.tar.gz
            dist/*.spdx.json
          if-no-files-found: error

  publish:
    # Dry runs (workflow_dispatch) stop after build; only a tag push publishes.
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: release

      - name: Combine checksums
        working-directory: release
        run: |
          sha256sum -- *.tar.gz *.spdx.json > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.tar.gz
            release/*.spdx.json

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "$TAG" --generate-notes
