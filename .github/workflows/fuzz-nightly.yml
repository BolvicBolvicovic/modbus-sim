name: Nightly fuzzing

# Deeper fuzzing than the per-push job in ci.yml: every harness for 600 s, continuing from the
# shared corpus cache. A crash opens (or comments on) an issue.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: true

      - name: Install clang and libFuzzer
        run: sudo apt-get update && sudo apt-get install -y clang "libclang-rt-$(clang -dumpversion | cut -d. -f1)-dev"

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: build/fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-

      - name: Fuzz every parser for 600 s in parallel (ASan + UBSan)
        run: make fuzz-run FUZZ_SECONDS=600

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-artifacts
          path: |
            build/fuzz/artifacts
            build/fuzz/*.log

      - name: Report the crash in an issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Nightly fuzzing found a crash"
          body="The nightly fuzz run failed: $RUN_URL (reproducers are in the \`fuzz-artifacts\` artifact; replay with \`build/fuzz/fuzz_NAME FILE\`)."
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq "[.[] | select(.title == \"$title\")][0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
