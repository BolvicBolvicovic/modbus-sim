name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # The prod, no-TLS and dev jobs use the Makefile's clang + ccache + mold defaults.
  CCACHE_DIR: .ccache

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install OpenSSL development files, ccache and mold
        run: sudo apt-get update && sudo apt-get install -y libssl-dev ccache mold

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-clang-${{ hashFiles('**/*.c', '**/*.h', 'Makefile') }}
          restore-keys: |
            ${{ runner.os }}-ccache-clang-

      - name: Build
        run: make -j$(nproc)

      - name: Dependency direction check
        run: |
          ./tools/check_deps.sh --self-test
          ./tools/check_deps.sh

      - name: Test runner self-test
        run: ./tools/run_tests.sh --self-test

      - name: Unit tests
        run: make -j$(nproc) tests

      - name: Check all profiles
        run: |
          for profile in profiles/*.scm; do
            ./mogbus --check "$profile"
          done

      - name: Check doc examples
        run: ./tools/check_doc_examples.sh ./mogbus

      - name: Sanitizers (ASan + UBSan, vendored s7 excluded)
        run: make -j$(nproc) asan

  no-tls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install ccache and mold
        run: sudo apt-get update && sudo apt-get install -y ccache mold

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-clang-${{ hashFiles('**/*.c', '**/*.h', 'Makefile') }}
          restore-keys: |
            ${{ runner.os }}-ccache-clang-

      - name: Build without TLS
        run: make -j$(nproc) WITH_TLS=0

      - name: Unit tests without TLS
        run: make -j$(nproc) WITH_TLS=0 tests

      - name: Check all profiles without TLS
        run: |
          for profile in profiles/*.scm; do
            ./mogbus --check "$profile"
          done

      - name: Check doc examples without TLS
        run: ./tools/check_doc_examples.sh ./mogbus

  dev:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BUILD: dev
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install OpenSSL development files, ccache and mold
        run: sudo apt-get update && sudo apt-get install -y libssl-dev ccache mold

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-clang-${{ hashFiles('**/*.c', '**/*.h', 'Makefile') }}
          restore-keys: |
            ${{ runner.os }}-ccache-clang-

      - name: Build (dev)
        run: make -j$(nproc)

      - name: Unit tests (dev)
        run: make -j$(nproc) tests

      - name: Check all profiles (dev)
        run: |
          for profile in profiles/*.scm; do
            ./mogbus --check "$profile"
          done

      - name: Check doc examples (dev)
        run: ./tools/check_doc_examples.sh ./mogbus

      - name: Sanitizers (dev)
        run: make -j$(nproc) asan

  analyzer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CC: clang
      # clang-tools' bundled clang does not accept -fuse-ld=mold, so override the
      # default LDFLAGS; the Makefile appends any missing hardening flags without
      # duplicating them.
      LDFLAGS: -pie -Wl,-z,relro,-z,now
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install OpenSSL development files and clang static analyzer
        run: sudo apt-get update && sudo apt-get install -y libssl-dev clang-tools

      # scan-build wraps the build with ccc-analyzer, so do not put ccache in CC here.
      # Prebuild vendored s7 normally: it is too large to analyze and is excluded from checks.
      - name: Static analysis (clang scan-build)
        run: |
          make clean
          make -j$(nproc) third_party/s7/s7.o
          scan-build --status-bugs --use-cc clang --exclude third_party/s7 -o scan-output make -j$(nproc)
