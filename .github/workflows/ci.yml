name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install OpenSSL development files
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      - name: Build
        run: make

      - name: Dependency direction check
        run: |
          ./tools/check_deps.sh --self-test
          ./tools/check_deps.sh

      - name: Test runner self-test
        run: ./tools/run_tests.sh --self-test

      - name: Unit tests
        run: make tests

      - name: Check all profiles
        run: |
          for profile in profiles/*.scm; do
            ./modbus-sim --check "$profile"
          done

      - name: Check doc examples
        run: ./tools/check_doc_examples.sh ./modbus-sim

      - name: Sanitizers (ASan + UBSan, vendored s7 excluded)
        run: make asan

  clang:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install OpenSSL development files
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      - name: Build (clang)
        run: make CC=clang

      - name: Unit tests (clang)
        run: make CC=clang tests

      - name: Check all profiles (clang)
        run: |
          for profile in profiles/*.scm; do
            ./modbus-sim --check "$profile"
          done

  analyzer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install OpenSSL development files
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      - name: Static analysis (gcc -fanalyzer)
        run: |
          make clean
          make CC=gcc CFLAGS='-std=gnu11 -O2 -g -Werror -Wextra -Wall -Wformat=2 -Wshadow -D_FORTIFY_SOURCE=2 -fstack-protector-strong -fPIE -fanalyzer' LDFLAGS='-pie -Wl,-z,relro,-z,now'
