name: CI

on:
  # Changes outside the lists below do not start CI. Profiles and tools stay in scope because
  # CI validates their contents; the Markdown pages are in scope because the api-docs job
  # builds them into the site (broken links fail it). Within a run, the changes job skips the build and test jobs
  # when C files changed only in comments, or only packaging files changed.
  push:
    paths:
      - 'src/**'
      - 'include/**'
      - 'examples/**'
      - 'tests/**'
      - 'tools/**'
      - 'vlib/**'
      - 'third_party/**'
      - 'profiles/**'
      - 'python/**'
      - 'deploy/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'Makefile'
      - 'Doxyfile'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'NOTICE.md'
      - 'AGENTS.md'
      - 'docs/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'examples/**'
      - 'tests/**'
      - 'tools/**'
      - 'vlib/**'
      - 'third_party/**'
      - 'profiles/**'
      - 'python/**'
      - 'deploy/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'Makefile'
      - 'Doxyfile'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'NOTICE.md'
      - 'AGENTS.md'
      - 'docs/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  # The prod, no-TLS and dev jobs use the Makefile's clang + ccache + mold defaults.
  CCACHE_DIR: .ccache

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
      docs: ${{ steps.classify.outputs.docs }}
      docker: ${{ steps.classify.outputs.docker }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Classify the change
        id: classify
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          [ "$EVENT" = workflow_dispatch ] && BASE=
          ./tools/ci_changes.sh "$BASE" "$GITHUB_SHA" | tee -a "$GITHUB_OUTPUT"

  build-and-test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install OpenSSL development files, ccache and mold
        run: sudo apt-get update && sudo apt-get install -y libssl-dev ccache mold

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-clang-${{ hashFiles('**/*.c', '**/*.h', 'Makefile') }}
          restore-keys: |
            ${{ runner.os }}-ccache-clang-

      - name: Build
        run: make -j$(nproc)

      - name: Dependency direction check
        run: |
          ./tools/check_deps.sh --self-test
          ./tools/check_deps.sh

      - name: Test runner self-test
        run: ./tools/run_tests.sh --self-test

      - name: Unit tests
        run: make -j$(nproc) tests

      - name: Load smoke test (32 clients, 5 s, no errors, no memory growth)
        run: ./tools/loadtest.py --spawn profiles/two-devices.scm --units 1,2 --clients 32 --duration 5

      - name: Check all profiles
        run: |
          for profile in profiles/*.scm; do
            ./mogbus --check "$profile"
          done

      - name: Check doc examples
        run: ./tools/check_doc_examples.sh ./mogbus

      - name: Sanitizers (ASan + UBSan, vendored s7 excluded)
        run: make -j$(nproc) asan

  no-tls:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install ccache and mold
        run: sudo apt-get update && sudo apt-get install -y ccache mold

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-clang-${{ hashFiles('**/*.c', '**/*.h', 'Makefile') }}
          restore-keys: |
            ${{ runner.os }}-ccache-clang-

      - name: Build without TLS
        run: make -j$(nproc) WITH_TLS=0

      - name: Unit tests without TLS
        run: make -j$(nproc) WITH_TLS=0 tests

      - name: Check all profiles without TLS
        run: |
          for profile in profiles/*.scm; do
            ./mogbus --check "$profile"
          done

      - name: Check doc examples without TLS
        run: ./tools/check_doc_examples.sh ./mogbus

      - name: Unit tests without config loader
        run: make -j$(nproc) WITH_CONFIG=0 tests

      - name: Unit tests without config loader and TLS
        run: make -j$(nproc) WITH_CONFIG=0 WITH_TLS=0 tests

  reproducible:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install OpenSSL development files and clang
        run: sudo apt-get update && sudo apt-get install -y libssl-dev clang

      - name: Reproducible build check (two builds in different directories)
        run: ./tools/check_reproducible.sh

  dev:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BUILD: dev
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install OpenSSL development files, ccache and mold
        run: sudo apt-get update && sudo apt-get install -y libssl-dev ccache mold

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-clang-${{ hashFiles('**/*.c', '**/*.h', 'Makefile') }}
          restore-keys: |
            ${{ runner.os }}-ccache-clang-

      - name: Build (dev)
        run: make -j$(nproc)

      - name: Unit tests (dev)
        run: make -j$(nproc) tests

      - name: Check all profiles (dev)
        run: |
          for profile in profiles/*.scm; do
            ./mogbus --check "$profile"
          done

      - name: Check doc examples (dev)
        run: ./tools/check_doc_examples.sh ./mogbus

      - name: Sanitizers (dev)
        run: make -j$(nproc) asan

  fuzz:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install clang and libFuzzer
        run: sudo apt-get update && sudo apt-get install -y clang "libclang-rt-$(clang -dumpversion | cut -d. -f1)-dev"

      - name: Fuzz every parser for 60 s (ASan + UBSan)
        run: make fuzz-run FUZZ_SECONDS=60

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-artifacts
          path: |
            build/fuzz/artifacts
            build/fuzz/*.log

  interop:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install OpenSSL development files and pymodbus
        run: |
          sudo apt-get update && sudo apt-get install -y libssl-dev
          python3 -m venv .venv && .venv/bin/pip install 'pymodbus==3.8.6'

      - name: Build
        run: make -j$(nproc)

      - name: pymodbus against every network transport
        run: .venv/bin/python examples/interop/pymodbus_interop.py

  python:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install OpenSSL development files
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      - name: Build the library
        run: make -j$(nproc) lib

      - name: Python package tests
        run: make python-tests

      - name: Python examples
        run: make python-examples

  api-docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen

      - name: Doxygen comments are valid (warnings are errors)
        run: make api-docs

  analyzer:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CC: clang
      # clang-tools' bundled clang does not accept -fuse-ld=mold, so override the
      # default LDFLAGS; the Makefile appends any missing hardening flags without
      # duplicating them.
      LDFLAGS: -pie -Wl,-z,relro,-z,now
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install OpenSSL development files and clang static analyzer
        run: sudo apt-get update && sudo apt-get install -y libssl-dev clang-tools

      # scan-build wraps the build with ccc-analyzer, so do not put ccache in CC here.
      # Prebuild vendored s7 normally: it is too large to analyze and is excluded from checks.
      - name: Static analysis (clang scan-build)
        run: |
          make clean
          make -j$(nproc) third_party/s7/s7.o
          scan-build --status-bugs --use-cc clang --exclude third_party/s7 -o scan-output make -j$(nproc)

  docker:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Build image
        run: docker build --build-arg VERSION=ci -t mogbus:ci .

      - name: Image runs as the non-root user
        run: |
          user=$(docker inspect -f '{{.Config.User}}' mogbus:ci)
          echo "Config.User=$user"
          test "$user" = "10001:10001"

      - name: Run hardened (read-only, no capabilities, limits)
        run: |
          docker run -d --name mogbus --read-only --cap-drop ALL \
            --security-opt no-new-privileges --memory 64m --pids-limit 64 \
            -p 127.0.0.1:1502:1502 -p 127.0.0.1:9102:9102 mogbus:ci

      - name: Wait for the Docker health check
        run: |
          for _ in $(seq 1 45); do
            status=$(docker inspect -f '{{.State.Health.Status}}' mogbus)
            echo "health: $status"
            [ "$status" = healthy ] && exit 0
            [ "$(docker inspect -f '{{.State.Running}}' mogbus)" = true ] || break
            sleep 2
          done
          docker logs mogbus
          docker inspect -f '{{json .State.Health}}' mogbus
          exit 1

      - name: Read a register from the host
        run: |
          out=$(./tools/modbus_probe.py holding 0 1)
          echo "$out"
          echo "$out" | grep -q 42

      - name: HTTP readiness and Prometheus metrics from the host
        run: |
          curl -fsS http://127.0.0.1:9102/readyz
          curl -fsS http://127.0.0.1:9102/healthz
          metrics=$(curl -fsS http://127.0.0.1:9102/metrics)
          echo "$metrics" | grep -E '^mogbus_(ready|requests_total|responses_total)'
          echo "$metrics" | grep -q '^mogbus_ready 1$'
          echo "$metrics" | grep -q '^mogbus_requests_total{fc="3"} 1$'

      - name: Process is PID 1, unprivileged and without capabilities
        run: |
          docker exec mogbus cat /proc/1/cmdline | tr '\0' ' '; echo
          docker exec mogbus grep -E '^(Uid|Gid|CapEff|NoNewPrivs):' /proc/1/status
          docker exec mogbus grep -qE '^Uid:[[:space:]]+10001[[:space:]]' /proc/1/status
          docker exec mogbus grep -qE '^CapEff:[[:space:]]+0+$' /proc/1/status
          docker top mogbus

      - name: SIGTERM stops the container promptly and cleanly
        run: |
          start=$(date +%s)
          docker stop -t 10 mogbus
          elapsed=$(( $(date +%s) - start ))
          code=$(docker inspect -f '{{.State.ExitCode}}' mogbus)
          echo "stopped in ${elapsed}s, exit code $code"
          test "$code" = 0
          test "$elapsed" -lt 8

      - name: Compose file is valid
        run: docker compose -f deploy/docker-compose.yml config --quiet
