# Apply:  kubectl apply -f deploy/kubernetes/mogbus.yaml
# The image must be built and pushed to a registry the cluster can pull from, then the `image`
# below changed to match (see docs/user/deployment/docker.md).
apiVersion: v1
kind: ConfigMap
metadata:
  name: mogbus-config
data:
  mogbus.scm: |
    (server
      (mode tcp)
      (port 1502)
      (bind "0.0.0.0")
      (idle-timeout-ms 60000)
      (http (port 9102) (bind "0.0.0.0")))

    (device
      (name "Kubernetes example")
      (unit-id 1)
      (holding 0 (static 42)))
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mogbus
  labels:
    app: mogbus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mogbus
  template:
    metadata:
      labels:
        app: mogbus
      # For a Prometheus that discovers pods by these common annotations; with the Prometheus
      # Operator, use a PodMonitor on the `http` port instead.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9102"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mogbus
          image: mogbus:0.0.1
          args: ["/etc/mogbus/mogbus.scm"]
          ports:
            - name: modbus
              containerPort: 1502
              protocol: TCP
            - name: http
              containerPort: 9102
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 500m
              memory: 64Mi
          volumeMounts:
            - name: config
              mountPath: /etc/mogbus
              readOnly: true
          # /readyz is 200 while the transport is serving; /healthz answers from the server's
          # own poll loop, so it fails if the loop stalls. Without (http ...), use an exec
          # probe instead: ["/usr/local/bin/mogbus", "--health", "/etc/mogbus/mogbus.scm"].
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: mogbus-config
---
apiVersion: v1
kind: Service
metadata:
  name: mogbus
spec:
  selector:
    app: mogbus
  ports:
    - name: modbus
      port: 1502
      targetPort: modbus
      protocol: TCP
    - name: http
      port: 9102
      targetPort: http
      protocol: TCP
